CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_DEVICE_NAME="RL Race Test"

# Allow enough identities for 3 bonds
CONFIG_BT_MAX_PAIRED=3

CONFIG_LOG=y
CONFIG_ASSERT=y

# Settings / NVS / flash for persistent bond storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Increased stack for settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
